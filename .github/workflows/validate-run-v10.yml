name: Seizo run controls v10 validation
on:
  push:
    branches: [seizo-run-controls-v10]
    paths: [.github/workflows/validate-run-v10.yml, scripts/assemble_run_v10.py]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      SEIZO_PHYSICS_ENGINE: mujoco
    steps:
      - name: Preserve exact source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install simulator dependencies
        run: |
          python -m pip install --disable-pip-version-check 'numpy<3' 'mujoco==3.3.7'
      - name: Software OpenGL for GPU-less Windows CI only
        if: runner.os == 'Windows'
        uses: f3d-app/install-mesa-windows-action@b78081f8331c5d49d71b221ca13a25fd97dac165
        with:
          path: ${{ env.pythonLocation }}
          version: 23.3.5
      - name: Linux RGB renderer libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1-mesa-dri libgl1 libgles2
          echo 'MUJOCO_GL=egl' >> "$GITHUB_ENV"
          echo 'PYOPENGL_PLATFORM=egl' >> "$GITHUB_ENV"
      - name: Assemble checksum-verified source
        run: python scripts/assemble_run_v10.py
      - name: Complete application regression suite
        working-directory: Seizo_Learn
        run: |
          set -o pipefail
          python -m compileall -q core app.py bootstrap.py
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee evidence/v10-tests.txt
          node tests/gripper_model.mjs | tee evidence/geometry-check.json
      - name: Install real browser
        if: runner.os == 'Linux'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser end/save, timing, preview and resume checks
        if: runner.os == 'Linux'
        working-directory: Seizo_Learn
        run: python tests/browser_run_controls_v10.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seizo-run-v10-${{ runner.os }}-evidence
          path: Seizo_Learn/evidence/
          retention-days: 7
  stage-tested-source:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seizo-run-controls-v10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Stage verified source without publishing the stable updater
        run: |
          python scripts/assemble_run_v10.py
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          for name in json.loads(Path('v10_paths.json').read_text()):
              dst=Path('patches')/name
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(Path('Seizo_Learn')/name,dst)
          PY
          git config user.name 'Seizo validation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add patches
          git commit -m 'Validated v10 run controls; preserve v9 policy and camera input layout'
          git push origin HEAD:seizo-run-controls-v10
          python - <<'PY'
          import json,hashlib,subprocess
          from pathlib import Path
          previous=json.loads(Path('desktop_manifest.json').read_text())
          ref=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          patches={}
          for path in sorted(Path('patches').rglob('*')):
              if path.is_file():
                  name=path.relative_to('patches').as_posix()
                  patches[name]={'url':f'https://raw.githubusercontent.com/gmaxdragon/seizo/{ref}/patches/{name}','sha256':hashlib.sha256(path.read_bytes()).hexdigest()}
          result={'schema':'seizo-desktop-manifest/v1','version':'2026.10.15-run-controls-v10','base':previous['base'],'patches':patches}
          Path('desktop_manifest.json').write_text(json.dumps(result,separators=(',',':'))+'\n')
          print('Pinned source',ref,'with',len(patches),'patches. Stable channel remains unchanged.')
          PY
          git add desktop_manifest.json
          git commit -m 'Prepare pinned v10 manifest for reviewed stable promotion'
          git push origin HEAD:seizo-run-controls-v10
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: seizo-v10-verified-source
          path: |
            patches/
            desktop_manifest.json
          retention-days: 7
