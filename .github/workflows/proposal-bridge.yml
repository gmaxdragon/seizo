name: Seizo proposal bridge (no motion)
on:
  push:
    branches: [seizo-proposal-bridge-20261015]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seizo-proposal-dev
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
      LIBGL_ALWAYS_SOFTWARE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seizo-proposal-bridge-20261015
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact locally tested integration to development branch only
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess
          assert os.environ['GITHUB_REF'] == 'refs/heads/seizo-proposal-bridge-20261015'
          expected = json.loads(pathlib.Path('tools/proposal-integration-sha256.json').read_text())
          def matches():
              return all(hashlib.sha256((pathlib.Path('patches')/name).read_bytes()).hexdigest() == sha for name, sha in expected.items())
          if not matches():
              subprocess.run(['git','apply','--check','tools/proposal-integration.patch'],check=True)
              subprocess.run(['git','apply','tools/proposal-integration.patch'],check=True)
          assert matches(), 'Integration bytes differ from locally tested files'
      - name: Assemble existing pinned application without user data
        shell: python
        run: |
          import hashlib, json, pathlib, shutil, tarfile
          root=pathlib.Path('.')
          manifest=json.loads((root/'desktop_manifest.json').read_text())
          archive=root/'Seizo_Learn_Web.tar.xz'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==manifest['base']['sha256']
          dest=root/'bridge-runtime';dest.mkdir()
          with tarfile.open(archive,'r:xz') as tf:
              tf.extractall(dest,filter='data')
          candidates=[p.parent for p in dest.rglob('app.py') if (p.parent/'core').is_dir()]
          assert len(candidates)==1,candidates
          app=candidates[0]
          shutil.copytree(root/'patches',app,dirs_exist_ok=True)
          (root/'runtime-path.txt').write_text(str(app))
          assert (app/'tests/test_proposal_bridge.py').is_file()
      - name: Install pinned simulation and CPU graphics test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libosmesa6 libgl1-mesa-dri libegl1 libegl-mesa0
          python -m pip install 'numpy<3' 'mujoco==3.3.7' pillow playwright
          python -m playwright install --with-deps chromium
          python -c 'import mujoco; print("MuJoCo", mujoco.__version__)'
      - name: Run full application regression suite
        shell: bash
        run: |
          set -o pipefail
          cd "$(cat runtime-path.txt)"
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee proposal-full-tests.txt
      - name: Real browser proposal and STOP test
        shell: bash
        run: |
          set -o pipefail
          cd "$(cat runtime-path.txt)"
          node --input-type=module --check < web/proposal_ui.js
          node --input-type=module --check < web/app.js
          python tests/browser_proposal_bridge.py 2>&1 | tee proposal-browser-tests.txt
      - name: Publish only verified integration files on this development branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/seizo-proposal-bridge-20261015
          git add -- patches/app.py patches/core/cloud.py patches/core/runner.py patches/web/app.js patches/web/index.html patches/tests/test_camera_release.py
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Integrate validated no-motion proposal bridge into existing desktop app'
            git push origin HEAD:refs/heads/seizo-proposal-bridge-20261015
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seizo-proposal-runtime-source
          path: |
            bridge-runtime/
            runtime-path.txt
          retention-days: 7
  windows_protocol:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seizo-proposal-bridge-20261015
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assemble exact integration for Windows protocol and checkpoint tests
        shell: python
        run: |
          import hashlib,json,pathlib,shutil,subprocess,tarfile
          root=pathlib.Path('.')
          expected=json.loads((root/'tools/proposal-integration-sha256.json').read_text())
          def matches():
              return all(hashlib.sha256((root/'patches'/n).read_bytes()).hexdigest()==h for n,h in expected.items())
          if not matches():
              subprocess.run(['git','apply','--check','tools/proposal-integration.patch'],check=True)
              subprocess.run(['git','apply','tools/proposal-integration.patch'],check=True)
          assert matches()
          manifest=json.loads((root/'desktop_manifest.json').read_text());archive=root/'Seizo_Learn_Web.tar.xz'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==manifest['base']['sha256']
          dest=root/'bridge-runtime';dest.mkdir()
          with tarfile.open(archive,'r:xz') as tf:tf.extractall(dest,filter='data')
          candidates=[p.parent for p in dest.rglob('app.py') if (p.parent/'core').is_dir()]
          assert len(candidates)==1
          app=candidates[0];shutil.copytree(root/'patches',app,dirs_exist_ok=True)
          (root/'runtime-path.txt').write_text(str(app))
      - name: Install numerical dependency only
        run: python -m pip install 'numpy<3'
      - name: Windows protocol checkpoint HTTP and credential tests
        shell: pwsh
        run: |
          Set-Location (Get-Content runtime-path.txt)
          python -m unittest discover -s tests -p 'test_proposal*.py' -v 2>&1 | Tee-Object proposal-windows-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_key_storage.py' -v 2>&1 | Tee-Object proposal-windows-key-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seizo-proposal-windows-tests
          path: bridge-runtime/**/proposal-windows*.txt
          retention-days: 7
