name: Seizo gripper behavior validation
on:
  push:
    branches: ['seizo-gripper-fix']
    paths: ['patches/**', '.github/workflows/gripper-behavior.yml']
permissions:
  contents: read
jobs:
  gripper:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      SEIZO_PHYSICS_ENGINE: mujoco
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install local physics and browser test dependencies
        run: |
          python -m pip install 'mujoco==3.3.7' 'numpy<3' playwright
          python -m playwright install --with-deps chromium
      - name: Assemble simulation-only app
        run: |
          tar -xJf Seizo_Learn_Web.tar.xz
          cp -r patches/. Seizo_Learn/
          mkdir -p Seizo_Learn/evidence
      - name: Actual physics and HTTP regression tests
        working-directory: Seizo_Learn
        run: |
          python -m unittest discover -s tests -p 'test_gripper*.py' -v 2>&1 | tee evidence/gripper-tests.txt
          python -m unittest discover -s tests -p 'test_mujoco*.py' -v 2>&1 | tee evidence/mujoco-tests.txt
          node tests/gripper_model.mjs | tee evidence/geometry-check.json
      - name: Real browser controls and WebGL rendering
        working-directory: Seizo_Learn
        run: python tests/browser_gripper.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seizo-gripper-v5-evidence
          path: Seizo_Learn/evidence/
          retention-days: 7
