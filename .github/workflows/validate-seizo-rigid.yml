name: Validate Seizo rigid-body physics
on:
  push:
    branches: [seizo-mujoco-validation]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free CPU physics library
        run: python -m pip install --disable-pip-version-check 'numpy>=1.24,<3' 'mujoco>=3.3,<4'
      - name: Assemble desktop test source without Pi programs
        run: |
          tar -xJf Seizo_Learn_Web.tar.xz
          cp patches/core/*.py Seizo_Learn/core/
          mkdir -p Seizo_Learn/tests
          cp patches/tests/test_mujoco_physics.py Seizo_Learn/tests/
          cp patches/tests/test_mujoco_integration.py Seizo_Learn/tests/
          cp patches/app.py Seizo_Learn/app.py
          cp patches/bootstrap.py Seizo_Learn/bootstrap.py
          cp patches/web/app.js Seizo_Learn/web/app.js
          cp patches/web/index.html Seizo_Learn/web/index.html
      - name: Compile complete source
        run: python -m compileall -q Seizo_Learn/core Seizo_Learn/bootstrap.py
      - name: Exercise actual MuJoCo rigid contacts and motors
        working-directory: Seizo_Learn
        env:
          SEIZO_PHYSICS_ENGINE: mujoco
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -p 'test_mujoco_physics.py' -v
          python -m unittest discover -s tests -p 'test_mujoco_integration.py' -v
